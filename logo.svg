<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923" />
      <stop offset="50%" stop-color="#003554" />
      <stop offset="100%" stop-color="#006466" />
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Golden Wheat Gradient -->
    <linearGradient id="wheatGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Stellar Orbit Gradient -->
    <linearGradient id="stellarOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Stellar Orbital Ellipse -->
  <ellipse cx="100" cy="100" rx="72" ry="32" transform="rotate(-30 100 100)" stroke="url(#stellarOrbit)" stroke-width="3" stroke-dasharray="8 4" filter="url(#glow)" />

  <!-- Orbital Stellar Satellite / Node Spark -->
  <circle cx="156" cy="68" r="5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="156" cy="68" r="2.5" fill="#FFFFFF" />

  <!-- Flowing Agri Channels (Base Waves) -->
  <path d="M 52 142 C 72 136, 88 148, 100 144 C 112 140, 128 132, 148 138" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <path d="M 60 152 C 78 146, 92 156, 100 153 C 108 150, 122 143, 140 148" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Central Wheat Sheaf & Sprouting Crop Structure -->
  <!-- Left Sprout Leaf -->
  <path d="M 100 134 C 85 118, 62 108, 65 84 C 78 84, 94 96, 100 114 Z" fill="url(#leafEmerald)" />

  <!-- Right Sprout Leaf -->
  <path d="M 100 126 C 114 112, 136 104, 134 82 C 121 83, 106 94, 100 110 Z" fill="url(#leafEmerald)" />

  <!-- Central Rising Grain Ear (Wheat Head) -->
  <!-- Grain Pod 1 (Bottom) -->
  <ellipse cx="94" cy="98" rx="7" ry="12" transform="rotate(-25 94 98)" fill="url(#wheatGold)" />
  <ellipse cx="106" cy="98" rx="7" ry="12" transform="rotate(25 106 98)" fill="url(#wheatGold)" />

  <!-- Grain Pod 2 (Middle) -->
  <ellipse cx="93" cy="78" rx="6.5" ry="11" transform="rotate(-25 93 78)" fill="url(#wheatGold)" />
  <ellipse cx="107" cy="78" rx="6.5" ry="11" transform="rotate(25 107 78)" fill="url(#wheatGold)" />

  <!-- Grain Pod 3 (Top Tip) -->
  <ellipse cx="95" cy="60" rx="5.5" ry="9" transform="rotate(-18 95 60)" fill="url(#wheatGold)" />
  <ellipse cx="105" cy="60" rx="5.5" ry="9" transform="rotate(18 105 60)" fill="url(#wheatGold)" />
  
  <!-- Central Summit Awn / Stellar Peak -->
  <path d="M 100 52 L 100 36 M 98 48 L 88 38 M 102 48 L 112 38" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />

  <!-- Central Stem -->
  <path d="M 100 136 L 100 62" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" />

  <!-- Brilliant Stellar Core Star Spark -->
  <polygon points="100,24 102,30 108,32 102,34 100,40 98,34 92,32 98,30" fill="#FFFFFF" filter="url(#glow)" />
</svg>
