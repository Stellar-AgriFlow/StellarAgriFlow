name: Security & Vulnerability Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Every Monday midnight

jobs:
  audit-rust:
    name: Audit Cargo Rust Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Cargo Audit
        run: cargo audit --manifest-path contracts/Cargo.lock --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159 || true

  audit-node:
    name: Audit Node / pnpm Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high || true
