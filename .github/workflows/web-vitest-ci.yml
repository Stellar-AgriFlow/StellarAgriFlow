name: Web & TypeScript SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-vitest-ci.yml'
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Test & Lint TypeScript Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck
        run: pnpm turbo run lint

      - name: Run Vitest Unit Tests
        run: pnpm vitest run --coverage.enabled=false

      - name: Build Web Application & Packages
        run: pnpm turbo run build
