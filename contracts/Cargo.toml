[workspace]
resolver = "2"
members = [
    "farm-registry",
    "agricultural-finance",
    "agricultural-escrow",
    "agricultural-marketplace",
    "agricultural-reputation",
    "warehouse-receipt",
    "parametric-insurance",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

